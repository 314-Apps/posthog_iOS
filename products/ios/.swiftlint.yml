included:
  - App/Sources
  - Packages/PostHogKit/Sources
  - Packages/PostHogKit/Tests
  - UITests

excluded:
  - .build
  - .spm-packages
  - PostHog.xcodeproj

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - x
    - y
    - w
    - h
    - id

type_body_length:
  warning: 350

# Discriminated-union mapping switches (query kinds, retry ladders) run hot here.
cyclomatic_complexity:
  warning: 15
  error: 20

file_length:
  warning: 500

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
  - trailing_comma
