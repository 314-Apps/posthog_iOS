name: PostHog
options:
  bundleIdPrefix: com.posthog
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: true

packages:
  PostHogKit:
    path: Packages/PostHogKit

targets:
  PostHogApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PostHogKit
        product: AppShell
      - target: PostHogWidgets
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: App/Entitlements/PostHog.entitlements
    settings:
      base:
        PRODUCT_NAME: PostHog
        # The posthog-ios SDK's library module is named PostHog; the app keeps
        # its product name but compiles as a distinct module.
        PRODUCT_MODULE_NAME: PostHogApp
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2

  PostHogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
    dependencies:
      - package: PostHogKit
        product: PostHogFoundation
    entitlements:
      path: App/Entitlements/PostHogWidgets.entitlements
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: PostHog widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.posthog.ios.widgets
        SKIP_INSTALL: true

  PostHogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PostHogApp

schemes:
  PostHog:
    build:
      targets:
        PostHogApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PostHogUITests
        - package: PostHogKit/PostHogFoundationTests
        - package: PostHogKit/PostHogAPITests
        - package: PostHogKit/PostHogQueriesTests
        - package: PostHogKit/PostHogAuthTests
        - package: PostHogKit/AppShellTests
        - package: PostHogKit/DesignSystemSnapshotTests
        - package: PostHogKit/FeatureInboxTests
        - package: PostHogKit/FeatureErrorsTests
        - package: PostHogKit/FeatureLiveTests
        - package: PostHogKit/FeatureInsightsTests
        - package: PostHogKit/FeatureReplayTests
        - package: PostHogKit/FeatureMaxTests
        - package: PostHogKit/FeatureExperimentsTests
        - package: PostHogKit/FeatureSurveysTests
        - package: PostHogKit/FeatureWebTests
        - package: PostHogKit/FeaturePeopleTests
        - package: PostHogKit/FeatureSQLTests
        - package: PostHogKit/FeatureActivityTests
        - package: PostHogKit/PostHogDrilldownTests
    archive:
      config: Release
