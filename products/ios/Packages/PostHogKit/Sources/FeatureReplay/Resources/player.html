<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!--
        The only thing that stops the recording from reaching the network.

        rrweb rebuilds recorded nodes attribute for attribute, so a recorded <img src>,
        <link rel=stylesheet>, @font-face, background-image, <video src> or <iframe src>
        becomes a live subresource request to whatever host the recording named. Leaving
        CorsPlugin out does not prevent that; it only stops those URLs from being rewritten
        through a proxy. The replay iframe is a local-scheme document, so it inherits this
        policy, and every one of those loads is refused here.

        script-src 'unsafe-inline' covers this page's own bundle. It cannot let recorded
        markup run, because the replay iframe's sandbox has no allow-scripts as long as
        UNSAFE_replayCanvas stays false.

        connect-src carries both spellings of the same permission: 'self' is the page's own
        posthog-replay://player origin, and the bare scheme covers an engine that gives a
        custom-scheme document an opaque origin.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PostHog replay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1d1f27;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .PlayerFrame {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .PlayerFrame__content { position: absolute; top: 0; left: 0; }
        .PlayerFrame__content .replayer-wrapper { position: relative; }
        .PlayerFrame__content iframe { background-color: white; border: 0; }

        .replayer-mouse::after { content: ""; display: inline-block; width: 20px; height: 20px; background: rgb(73 80 246); border-radius: 100%; transform: translate(-50%, -50%); opacity: .3; }
        .replayer-mouse.active::after { animation: click .2s ease-in-out 1; }
