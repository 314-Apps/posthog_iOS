name: iOS Release

on:
    push:
        tags:
            - 'ios-v*'

concurrency:
    group: ios-release
    cancel-in-progress: false

jobs:
    build-upload:
        runs-on: depot-macos-26
        timeout-minutes: 60
        permissions:
            contents: read
        defaults:
            run:
                working-directory: products/ios
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install xcodegen
              run: brew install xcodegen

            - name: Derive and stamp versions
              id: version
              run: |
                  MARKETING_VERSION="${GITHUB_REF#refs/tags/ios-v}"
                  # Monotonic per run and per attempt, so a re-run never reuses a
                  # build number App Store Connect has already seen.
                  BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
                  echo "Marketing version: $MARKETING_VERSION, build number: $BUILD_NUMBER"
                  ./scripts/set-version.sh "$MARKETING_VERSION" "$BUILD_NUMBER"
                  echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
                  echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

            # PostHog.xcodeproj is generated by xcodegen, not committed.
            - name: Generate Xcode project
              run: make generate

            - name: Write App Store Connect API key
              env:
                  IOS_ASC_API_KEY_P8: ${{ secrets.IOS_ASC_API_KEY_P8 }}
              run: echo "$IOS_ASC_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

            # Cloud signing: -allowProvisioningUpdates with the ASC API key lets
            # xcodebuild fetch certificates and profiles, so no keychain import is needed.
            - name: Archive
              env:
                  IOS_ASC_API_KEY_ID: ${{ secrets.IOS_ASC_API_KEY_ID }}
                  IOS_ASC_API_ISSUER_ID: ${{ secrets.IOS_ASC_API_ISSUER_ID }}
              run: |
                  xcodebuild archive \
                    -project PostHog.xcodeproj \
                    -scheme PostHog \
                    -destination 'generic/platform=iOS' \
                    -archivePath "$RUNNER_TEMP/PostHog.xcarchive" \
                    -allowProvisioningUpdates \
                    -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
                    -authenticationKeyID "$IOS_ASC_API_KEY_ID" \
                    -authenticationKeyIssuerID "$IOS_ASC_API_ISSUER_ID"

            # destination: upload signs the build and sends it to TestFlight in one step.
            # manageAppVersionAndBuildNumber is off because set-version.sh already
            # stamped the versions this workflow derived from the tag.
            - name: Export and upload to TestFlight
              env:
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  IOS_ASC_API_KEY_ID: ${{ secrets.IOS_ASC_API_KEY_ID }}
                  IOS_ASC_API_ISSUER_ID: ${{ secrets.IOS_ASC_API_ISSUER_ID }}
              run: |
                  cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store-connect</string>
                      <key>destination</key>
                      <string>upload</string>
                      <key>manageAppVersionAndBuildNumber</key>
                      <false/>
                      <key>teamID</key>
                      <string>${APPLE_TEAM_ID}</string>
                  </dict>
                  </plist>
                  EOF
                  xcodebuild -exportArchive \
                    -archivePath "$RUNNER_TEMP/PostHog.xcarchive" \
                    -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                    -exportPath "$RUNNER_TEMP/export" \
                    -allowProvisioningUpdates \
                    -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
                    -authenticationKeyID "$IOS_ASC_API_KEY_ID" \
                    -authenticationKeyIssuerID "$IOS_ASC_API_ISSUER_ID"

            - name: Zip dSYMs
              env:
                  MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
              run: |
                  (cd "$RUNNER_TEMP/PostHog.xcarchive/dSYMs" && \
                    zip -r "$RUNNER_TEMP/PostHog-ios-v${MARKETING_VERSION}-dSYMs.zip" .)

            # With destination: upload the export goes straight to App Store Connect
            # and usually leaves no local .ipa, so a missing file is not an error.
            - name: Upload ipa artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ios-ipa
                  path: ${{ runner.temp }}/export/*.ipa
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Upload dSYMs artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ios-dSYMs
                  path: ${{ runner.temp }}/PostHog-ios-v${{ steps.version.outputs.marketing_version }}-dSYMs.zip
                  retention-days: 30

            # Fetched here rather than at job start because app installation tokens
            # expire after one hour and the build uses most of that.
            - name: Get app token
              id: app-token
              uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
              with:
                  app_id: ${{ secrets.GH_APP_ARRAY_RELEASER_APP_ID }}
                  private_key: ${{ secrets.GH_APP_ARRAY_RELEASER_PRIVATE_KEY }}

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
                  BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
              run: |
                  TAG="ios-v${MARKETING_VERSION}"
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "Release $TAG already exists. Reusing it."
                  else
                    gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
                      --notes "PostHog iOS ${MARKETING_VERSION} (build ${BUILD_NUMBER}). Uploaded to TestFlight."
                  fi
                  gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                    "$RUNNER_TEMP/PostHog-${TAG}-dSYMs.zip"
